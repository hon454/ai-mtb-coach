[project]
name = "ai-mtb-coach"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch",
  "torchvision",
  "ultralytics",
  "opencv-python",
  "lap",
  "scipy",
  "numpy",
  "matplotlib",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
